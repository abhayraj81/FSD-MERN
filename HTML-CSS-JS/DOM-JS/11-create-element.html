<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align ="center">DOM Demo Page 11 (create element)</h1>
    
    <button onclick="myfun()">Button</button>
    <div id="myDiv" style="border: 5px groove; height: 100px;"></div>

    <script>
        function myfun(){
            let btn = document.createElement("button")
            btn.textContent = "Button";
            btn.setAttribute("type","button");

            // event handling by event listeners
            btn.addEventListener("click",()=>{
                alert("i am onnn.............")
            })

            let d = document.getElementById("myDiv")
            d.append(btn);
            // let d = document.createElement("div")
            // d.textContent = "My Division";
            // d.align = "center"
            // d.setAttribute("id","myDiv");
            // // console.log(d);            
            // document.body.append(d)  //add at last
            // document.body.prepend(d) // add at first

        }
    </script>
</body>
</html>
